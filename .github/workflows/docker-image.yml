name: Docker Image CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Only authenticate and push on merged/pushed default-branch commits, never on PRs.
    if: github.event_name == 'push' && github.actor != 'dependabot[bot]'

    steps:
      - uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build the Docker image
        run: docker build . --file Dockerfile --tag envidtech/terminal-commands:latest

      - name: Push to Docker Hub
        run: docker push envidtech/terminal-commands:latest

  # Build-only verification for pull requests and Dependabot runs (no secrets or push)
  build-only:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.actor == 'dependabot[bot]'

    steps:
      - uses: actions/checkout@v7

      - name: Build the Docker image (test only)
        run: docker build . --file Dockerfile --tag envidtech/terminal-commands:test